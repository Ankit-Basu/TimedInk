# Local dev infrastructure for Outbox Pilot.
#
# Only MySQL + Redis run here — the API, worker and frontend run on the host
# (`npm run dev`) so that reloads are instant and stack traces point at real
# source files. See README.md ("Running the app").
#
#   docker compose up -d
#
services:
  mysql:
    image: mysql:8.0
    container_name: outbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-outbox}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-outbox_pilot}
    ports:
      # Host 3307 -> container 3306, so we don't collide with a MySQL that may
      # already be installed natively on the reviewer's machine.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - outbox-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-outbox}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: outbox-redis
    restart: unless-stopped
    # --appendonly yes => AOF persistence. Delayed BullMQ jobs survive a
    # `docker compose restart redis`, which is half of the restart story
    # (the other half is the boot-time reconciler, which treats MySQL as the
    # source of truth — see backend/src/services/reconciliation.ts).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - outbox-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  outbox-mysql-data:
  outbox-redis-data:
