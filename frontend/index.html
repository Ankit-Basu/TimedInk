<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0812" />
    <meta
      name="description"
      content="TimedInk — schedule email at scale with BullMQ, and watch every send land on time."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TimedInk</title>

    <!--
      Three faces, each with a system fallback in index.css so the app stays
      legible if these never arrive: Fraunces for headlines, Geist for UI,
      JetBrains Mono for labels and figures.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Painted before the CSS bundle lands, so there is no white flash. */
      html, body { background-color: #0b0812; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
